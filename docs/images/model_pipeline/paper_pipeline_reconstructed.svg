<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Recovered FoundSkelModel fall pipeline</title>
  <desc id="desc">Vector reconstruction from the 2026-08-27 written provenance; not the deleted original artwork.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 25px sans-serif;fill:#0f172a}.panel{font:700 18px sans-serif;fill:#0f172a}.label{font:600 14px sans-serif;fill:#0f172a}.small{font:12px sans-serif;fill:#334155}.box{rx:12;stroke-width:2}.up{fill:#e0f2fe;stroke:#0284c7}.ours{fill:#dcfce7;stroke:#16a34a}.analysis{fill:#fef3c7;stroke:#d97706}.future{fill:#f1f5f9;stroke:#94a3b8;stroke-dasharray:8 5}.edge{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="780" fill="#ffffff"/>
  <text x="40" y="42" class="title">FoundSkelModel Fall Specialist — recovered architecture</text>
  <text x="40" y="68" class="small">Blue: public upstream · Green: project implementation · Amber: implemented analysis path, adoption=false · Dashed: future</text>

  <text x="40" y="112" class="panel">(a) Current RGB-to-skeleton fall path</text>
  <g transform="translate(40 135)">
    <rect class="box up" width="130" height="72"/><text class="label" x="65" y="30" text-anchor="middle">RGB video</text><text class="small" x="65" y="51" text-anchor="middle">25 FPS</text>
    <path class="edge" d="M130 36H164"/>
    <rect class="box up" x="165" width="150" height="72"/><text class="label" x="240" y="25" text-anchor="middle">YOLOv8x</text><text class="small" x="240" y="48" text-anchor="middle">project tracker</text>
    <path class="edge" d="M315 36H349"/>
    <rect class="box up" x="350" width="150" height="72"/><text class="label" x="425" y="25" text-anchor="middle">ViTPose-B</text><text class="small" x="425" y="48" text-anchor="middle">COCO17 XY</text>
    <path class="edge" d="M500 36H534"/>
    <rect class="box up" x="535" width="180" height="72"/><text class="label" x="625" y="25" text-anchor="middle">MotionAGFormer-B</text><text class="small" x="625" y="48" text-anchor="middle">V3 overlap-add</text>
    <path class="edge" d="M715 36H749"/>
    <rect class="box ours" x="750" width="155" height="72"/><text class="label" x="827" y="25" text-anchor="middle">Proxy NTU25</text><text class="small" x="827" y="48" text-anchor="middle">normalize</text>
    <path class="edge" d="M905 36H939"/>
    <rect class="box up" x="940" width="135" height="72"/><text class="label" x="1007" y="25" text-anchor="middle">Frozen DSTE</text><text class="small" x="1007" y="48" text-anchor="middle">64×2048</text>
    <path class="edge" d="M1075 36H1109"/>
    <rect class="box ours" x="1110" width="120" height="72"/><text class="label" x="1170" y="25" text-anchor="middle">J1</text><text class="small" x="1170" y="48" text-anchor="middle">zero-init</text>
    <path class="edge" d="M1230 36H1264"/>
    <rect class="box ours" x="1265" width="125" height="72"/><text class="label" x="1327" y="25" text-anchor="middle">G2 head</text><text class="small" x="1327" y="48" text-anchor="middle">Fall event</text>

    <rect class="box ours" x="535" y="112" width="180" height="72"/><text class="label" x="625" y="137" text-anchor="middle">Global motion</text><text class="small" x="625" y="160" text-anchor="middle">causal 131-D</text>
    <path class="edge" d="M500 55C520 55 510 148 535 148"/>
    <path class="edge" d="M715 148H1220C1250 148 1245 62 1265 62"/>
    <rect class="box up" x="940" y="112" width="135" height="72"/><text class="label" x="1007" y="137" text-anchor="middle">Frozen ADL</text><text class="small" x="1007" y="160" text-anchor="middle">60 classes</text>
    <path class="edge" d="M1007 72V112"/>
  </g>

  <text x="40" y="370" class="panel">(b) Contextual recovery analysis path — implemented, not finally adopted</text>
  <g transform="translate(40 395)">
    <rect class="box analysis" width="195" height="76"/><text class="label" x="97" y="28" text-anchor="middle">Dense DSTE</text><text class="small" x="97" y="52" text-anchor="middle">64×2048</text>
    <path class="edge" d="M195 38H244"/>
    <rect class="box analysis" x="245" width="175" height="76"/><text class="label" x="332" y="28" text-anchor="middle">S0-A state head</text><text class="small" x="332" y="52" text-anchor="middle">16-class posterior</text>
    <path class="edge" d="M420 38H469"/>
    <rect class="box ours" x="470" width="185" height="76"/><text class="label" x="562" y="28" text-anchor="middle">Posterior dynamics</text><text class="small" x="562" y="52" text-anchor="middle">35-D</text>
    <path class="edge" d="M655 38H704"/>
    <rect class="box analysis" x="705" width="165" height="76"/><text class="label" x="787" y="28" text-anchor="middle">S0-G0 endpoint</text><text class="small" x="787" y="52" text-anchor="middle">2083→4</text>
    <path class="edge" d="M870 38H919"/>
    <rect class="box ours" x="920" width="200" height="76"/><text class="label" x="1020" y="28" text-anchor="middle">D1 decoder</text><text class="small" x="1020" y="52" text-anchor="middle">decoupled memories</text>
    <path class="edge" d="M1120 38H1169"/>
    <rect class="box ours" x="1170" width="220" height="76"/><text class="label" x="1280" y="24" text-anchor="middle">Event states</text><text class="small" x="1280" y="47" text-anchor="middle">FALLING · POST_FALL</text><text class="small" x="1280" y="64" text-anchor="middle">RECOVERING · RECOVERED</text>
  </g>

  <text x="40" y="555" class="panel">(c) Remaining work</text>
  <g transform="translate(40 580)">
    <rect class="box future" width="240" height="82"/><text class="label" x="120" y="30" text-anchor="middle">Multi-person per-track</text><text class="small" x="120" y="55" text-anchor="middle">prototype, not adopted</text>
    <rect class="box future" x="275" width="240" height="82"/><text class="label" x="395" y="30" text-anchor="middle">Camera compensation</text><text class="small" x="395" y="55" text-anchor="middle">G3 adoption=false</text>
    <rect class="box future" x="550" width="260" height="82"/><text class="label" x="680" y="30" text-anchor="middle">Representation / context</text><text class="small" x="680" y="55" text-anchor="middle">model not fixed</text>
    <rect class="box future" x="845" width="250" height="82"/><text class="label" x="970" y="30" text-anchor="middle">New untouched benchmark</text><text class="small" x="970" y="55" text-anchor="middle">one-shot frozen protocol</text>
    <rect class="box future" x="1130" width="260" height="82"/><text class="label" x="1260" y="30" text-anchor="middle">Incremental streaming</text><text class="small" x="1260" y="55" text-anchor="middle">latency not validated</text>
  </g>
  <text x="40" y="735" class="small">Reconstructed 2026-09-02 from surviving prose; original PNG/SVG pixel provenance was not recoverable.</text>
</svg>
